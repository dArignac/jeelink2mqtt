[project]
name = "jeelink2mqtt"
version = "0.1.0"
description = "Jeelink to Homeassistant Bridge"
readme = "README.md"
authors = [{ name = "Alexander Herrmann" }]
requires-python = ">=3.12"
dependencies = ["asyncio>=4.0.0", "paho-mqtt>=2.1.0", "pyserial-asyncio>=0.6"]

[project.scripts]
jeelink2mqtt = "jeelink2mqtt:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
